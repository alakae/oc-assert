[project]
name = "oc-assert"
version = "0.1.0"
description = "Test an OpenCode permission config against a real OpenCode binary"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
oc-assert = "oc_assert.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.3",
]

[tool.mypy]
strict = true
files = ["src"]
